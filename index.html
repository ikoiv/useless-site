<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Useless Site</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Work in progress</p>
    <h1>Useless Site</h1>
    <p>No puzzles yet. For now, you can poke this dot.</p>
    <section class="experiment" aria-label="Poke the dot">
      <div class="dot" id="dot" aria-hidden="true"></div>
      <div class="controls">
        <button id="poke" type="button">Poke it</button>
        <button id="reset" type="button" class="secondary">Reset</button>
      </div>
      <p id="message" role="status" aria-live="polite">Just a dot.</p>
    </section>
  </main>
</body>
</html>
